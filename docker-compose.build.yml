# Build from source after code changes or when a local image is needed:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The default docker-compose.yml pulls a published image and does not build.

services:
  mailsift:
    build:
      context: .
      args:
        MAILSIFT_VERSION: ${MAILSIFT_VERSION:-local}
    image: mailsift:${MAILSIFT_VERSION:-local}
    pull_policy: never
